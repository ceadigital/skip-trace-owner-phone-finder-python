[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cea-skip-trace-owner-phone-finder"
version = "1.2.0"
description = "Python CLI, SDK & MCP Server for CEA Digital Skip Trace & LLC Owner Phone Finder (Direct Unified Key + Apify Store cea_digital/skip-trace-owner-phone-finder)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://ceadigital.io/tools"
Repository = "https://github.com/ceadigital/skip-trace-owner-phone-finder-python"
ApifyStore = "https://apify.com/cea_digital/skip-trace-owner-phone-finder"
PostmanCollection = "https://ceadigital.io/templates/postman-collection.json"
GoogleSheetsTemplate = "https://ceadigital.io/templates/Code.gs"
N8nWorkflow = "https://ceadigital.io/templates/skip-trace-owner-phone-finder.workflow.json"

[project.scripts]
cea-skip-trace = "skip_trace_cli:main"
cea-skip-trace-mcp = "mcp_server:main"
